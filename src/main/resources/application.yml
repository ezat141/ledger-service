server:
  port: 8082

spring:
  application:
    name: ledger-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/oauth2/jwks
          issuer-uri: http://localhost:8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
